<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Minha Rotina</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Rotina">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Aba Home: dia de hoje + horários -->
  <section id="tela-home" class="tela ativa">
    <header class="cabecalho-dia">
      <button id="dia-anterior" class="botao-texto">◀</button>
      <div class="textos-dia">
        <p id="dia-semana"></p>
        <h1 id="data-hoje"></h1>
      </div>
      <button id="dia-seguinte" class="botao-texto">▶</button>
    </header>
    <ul id="lista-horarios" class="horarios"></ul>
    <p id="status" class="status"></p>
  </section>

  <!-- Aba Calendário: mês / ano -->
  <section id="tela-calendario" class="tela">
    <div id="calendario"></div>
  </section>

  <!-- Barra de abas -->
  <nav class="abas">
    <button class="aba ativa" data-tela="tela-home">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Home</span>
    </button>
    <button class="aba" data-tela="tela-calendario">
      <svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/>
        <line x1="8" y1="2" x2="8" y2="6"/>
        <line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>Calendário</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
